name: بناء APK — pdfs

# مستقلّ تمامًا عن تطبيق Your World: يعمل فقط عند تغيّر مجلّد pdfs،
# وينشر في إصدار خاص به (pdfs-latest) دون المساس بإصدار apk-latest.
on:
  push:
    branches:
      - main
      - ccr-f588deac-7128ef
    paths:
      - 'pdfs/**'
      - '.github/workflows/build-pdfs-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdfs-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: بناء ملف تثبيت pdfs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pdfs

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pdfs/package-lock.json

      - name: تهيئة Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تهيئة Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: قبول التراخيص مسبقًا
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: تثبيت الحزم
        run: npm ci

      - name: بناء واجهة الويب
        run: npm run build

      - name: مزامنة مشروع أندرويد
        run: npx cap sync android

      - name: بناء APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain </dev/null

      - name: تسمية الملف
        id: name
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pdfs.apk
          echo "size=$(du -h out/pdfs.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: رفع الملف كمُخرَج
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-APK
          path: pdfs/out/pdfs.apk
          if-no-files-found: error

      - name: نشره في إصدار للتنزيل المباشر
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pdfs-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create pdfs-latest out/pdfs.apk \
            --target "$GITHUB_SHA" \
            --title "pdfs — أحدث نسخة" \
            --notes "ملف تثبيت تطبيق pdfs (${{ steps.name.outputs.size }}) — حوّل صورك إلى PDF.
          مبني من: \`$GITHUB_SHA\`

          **طريقة التثبيت:** افتح الرابط من متصفّح التلفون ← نزّل \`pdfs.apk\` ←
          افتح الملف ← اسمح بـ«التثبيت من مصادر غير معروفة» إن طلبها ← ثبّت.

          نسخة تجريبية (debug) موقّعة بمفتاح التطوير — تعمل كاملة، لكنها ليست للنشر على المتجر."
