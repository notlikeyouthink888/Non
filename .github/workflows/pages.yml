# نشر الصفحات على GitHub Pages
# الصفحة الرئيسية تبقى نفس صفحة الشطرنج المنشورة سابقًا، و«سرب القيادة» على /command-swarm/
name: نشر GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "command-swarm/**"
      - "legacy/chess.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}command-swarm/
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تجهيز الموقع
        run: |
          mkdir -p _site/command-swarm
          cp legacy/chess.html _site/index.html
          cp command-swarm/index.html _site/command-swarm/index.html
          touch _site/.nojekyll

      - name: إعداد Pages
        uses: actions/configure-pages@v5

      - name: رفع الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v5
