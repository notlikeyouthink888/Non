name: أساس — نشر خادم المدير

# ينشر asas/server/worker.js على Cloudflare Workers تلقائيًا (بدل لصق الكود في محرر اللوحة).
# يحتاج مرة واحدة أسرارًا في GitHub ← Settings ← Secrets and variables ← Actions ← Secrets:
#   CLOUDFLARE_API_TOKEN   رمز من dash.cloudflare.com/profile/api-tokens (قالب Edit Cloudflare Workers + صلاحية D1: Edit)
#   CLOUDFLARE_ACCOUNT_ID  معرّف حساب Cloudflare
#   ASAS_ADMIN_PASSWORD    كلمة سر لوحة المدير (اختياري إن ضبطتها من لوحة Cloudflare)
# دون هذه الأسرار يتخطى النشر بهدوء.
on:
  push:
    branches:
      - main
      - ccr-ba3f6671-bl9elf
    paths:
      - 'asas/server/**'
      - '.github/workflows/asas-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asas-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: نشر الخادم على Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: asas/server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ASAS_ADMIN_PASSWORD }}
      WRANGLER: npx --yes wrangler@4
    steps:
      - name: هل ضُبطت أسرار Cloudflare؟
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::لم تُضبط أسرار CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID بعد — تخطّي النشر."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - name: جلب الكود
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: تهيئة Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: قاعدة D1 (asas-db) — إيجادها أو إنشاؤها
        if: steps.gate.outputs.ready == 'true'
        run: |
          find_id() {
            $WRANGLER d1 list --json 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const i = s.indexOf("[");
                let list = [];
                try { list = JSON.parse(s.slice(i)); } catch {}
                const db = list.find((x) => x.name === "asas-db");
                process.stdout.write(db ? (db.uuid || db.database_id || "") : "");
              });'
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "لا توجد قاعدة asas-db — تُنشأ الآن"
            $WRANGLER d1 create asas-db
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then echo "::error::تعذّر إيجاد قاعدة asas-db أو إنشاؤها. تأكد أن الرمز فيه صلاحية D1: Edit."; exit 1; fi
          echo "قاعدة D1: $ID"
          cat > wrangler.toml <<EOF
          name = "asas-server"
          main = "worker.js"
          compatibility_date = "2025-01-01"

          [[d1_databases]]
          binding = "DB"
          database_name = "asas-db"
          database_id = "$ID"
          EOF
          cat wrangler.toml

      - name: نشر الخادم
        if: steps.gate.outputs.ready == 'true'
        run: $WRANGLER deploy 2>&1 | tee deploy.log

      - name: كلمة سر المدير
        if: steps.gate.outputs.ready == 'true' && env.ADMIN_PASSWORD != ''
        run: printf '%s' "$ADMIN_PASSWORD" | $WRANGLER secret put ADMIN_PASSWORD

      - name: الرابط
        if: steps.gate.outputs.ready == 'true'
        run: |
          URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "رابط الخادم: ${URL:-انظر سجل النشر}"
          {
            echo "### خادم «أساس» منشور ✓"
            echo ""
            echo "الرابط: ${URL:-انظر سجل النشر}"
            echo ""
            echo "افتح \`${URL}/admin/state\`: إن ظهر «كلمة سر المدير غير صحيحة» فكل شيء جاهز، وادخل من التطبيق ← لوحة مدير التطبيق."
          } >> "$GITHUB_STEP_SUMMARY"
