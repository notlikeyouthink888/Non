name: أساس — فحص وبناء APK

# تطبيق «أساس» يعيش في مجلد asas/ مستقلًا عن تطبيق Your World في جذر المستودع،
# ولا يُبنى إلا عند تغيّر ملفاته.
on:
  push:
    branches:
      - main
      - ccr-ba3f6671-bl9elf
    paths:
      - 'asas/**'
      - '.github/workflows/asas-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: asas

jobs:
  check:
    name: الفحص الآلي (محاكاة Claude والصور)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: asas/package-lock.json

      - name: تهيئة Python (لفحص ملف Word الناتج)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت الحزم
        run: |
          npm ci
          python -m pip install --quiet python-docx

      - name: تشغيل الفحص
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: npm run check

  apk:
    name: بناء ملف التثبيت
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: asas/package-lock.json

      - name: تهيئة Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تهيئة Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: قبول التراخيص مسبقًا
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: تثبيت الحزم
        run: npm ci

      - name: بناء واجهة الويب
        run: npm run build

      - name: مزامنة مشروع أندرويد
        run: npx cap sync android

      - name: بناء APK
        run: |
          chmod +x android/gradlew
          cd android
          # </dev/null يمنع التعليق إن طلب Gradle إدخالًا تفاعليًا
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain </dev/null

      - name: تسمية الملف
        id: name
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Asas.apk
          echo "size=$(du -h out/Asas.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: رفع الملف كمُخرَج
        uses: actions/upload-artifact@v4
        with:
          name: Asas-APK
          path: asas/out/Asas.apk
          if-no-files-found: error

      - name: نشره في إصدار للتنزيل المباشر
        env:
          GH_TOKEN: ${{ github.token }}
          # وسم جديد لكل بناء: المستودع يفعّل «الإصدارات غير القابلة للتعديل»،
          # فالوسم الذي استُعمل في إصدار سابق لا يُحذف ولا يُعاد استعماله (خطأ 422).
          TAG: asas-b${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          # إصدارات «أساس» تبقى تجريبية (pre-release) فلا تأخذ لقب «الأحدث» من إصدارات Your World،
          # وكل إصدار سابق يُعلَّم «(قديمة)» حتى لا يُنزَّل غير الأحدث (أرقام البناء بدأت من جديد مع هذا الملف).
          gh release list --limit 100 --json tagName,name,isPrerelease \
            --jq '.[] | select(.tagName | startswith("asas-")) | [.tagName, .name, (.isPrerelease | tostring)] | @tsv' |
          while IFS=$'\t' read -r old name pre; do
            case "$name" in
              *"(قديمة)") [ "$pre" = true ] && continue; title="$name" ;;
              *) title="$name (قديمة)" ;;
            esac
            gh release edit "$old" --prerelease --title "$title" || echo "::warning::تعذّر تحديث $old"
          done

          gh release create "$TAG" out/Asas.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "أساس — بناء ${{ github.run_number }}" \
            --notes "ملف التثبيت (${{ steps.name.outputs.size }}) — نزّله على تلفونك وثبّته.
          مبني من: \`$GITHUB_SHA\`
          كل الإصدارات: https://github.com/${{ github.repository }}/releases — الإصدارات السابقة معلَّمة «(قديمة)»

          **طريقة التثبيت:** افتح الرابط من متصفّح التلفون ← نزّل \`Asas.apk\` ←
          افتح الملف ← اسمح بـ«التثبيت من مصادر غير معروفة» إن طلبها ← ثبّت.

          **الجديد:** معادلات واضحة بكسور حقيقية بلا «/» (في التطبيق وPDF وWord)، أسلوب «طالب عادي» وكتابة طبيعية،
          تقارير بالإنجليزية، عناوين حسب الموضوع، خيارات تنسيق (إطار الصفحات، العناوين، الخط، المسافات، الترقيم)،
          غلاف جماعي بأسماء الطلبة وشعارين، وعرض PowerPoint للسمنار.

          **تفعيل الذكاء الاصطناعي مجانًا:** أنشئ مفتاحًا من openrouter.ai/keys، وفعّل النماذج المجانية من
          openrouter.ai/settings/privacy، ثم الصقه في الإعدادات ← الذكاء الاصطناعي ← OpenRouter.
          أو استعمل مفتاح Claude API (مدفوع، الأدق). بدون مفتاح يعمل التطبيق بالمحتوى الجاهز.

          نسخة تجريبية (debug) موقّعة بمفتاح التطوير — تعمل كاملة، لكنها ليست للنشر على المتجر."
