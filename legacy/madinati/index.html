<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<meta name="theme-color" content="#0b1016" />
<meta name="description" content="مدينتي — بانِي مدن ثلاثي الأبعاد" />
<title>مدينتي — بانِي المدن</title>
<style>
  :root { color-scheme: dark; --bg:#070b10; --fg:#e8eef6; --accent:#4db2ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family: "Segoe UI", "Noto Sans Arabic", "Tahoma", system-ui, sans-serif; overscroll-behavior:none; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ui-root { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #ui-root > * { pointer-events:auto; }
  #boot { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 35%, #16283d 0%, #070b10 70%); transition:opacity .6s ease, visibility .6s; }
  #boot.gone { opacity:0; visibility:hidden; }
  .boot-title { font-size:clamp(28px,6vw,52px); font-weight:700; letter-spacing:1px;
    background:linear-gradient(180deg,#eaf4ff,#7db6e8); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .boot-sub { margin-top:6px; font-size:14px; color:#7e93ab; }
  .boot-bar { margin-top:26px; width:min(320px,70vw); height:3px; background:#1b2735; border-radius:3px; overflow:hidden; }
  .boot-bar i { display:block; height:100%; width:35%; background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation: slide 1.25s ease-in-out infinite; }
  @keyframes slide { 0%{transform:translateX(-120%)} 100%{transform:translateX(420%)} }
  .boot-msg { margin-top:14px; font-size:12px; color:#5f7386; min-height:16px; }
  noscript { color:#fff; padding:20px; display:block; }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="ui-root"></div>
  <div id="boot">
    <div class="boot-title">مدينتي</div>
    <div class="boot-sub">بانِي مدن ثلاثي الأبعاد</div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-msg">جارٍ توليد الأنسجة والتضاريس…</div>
  </div>
  <noscript>هذا التطبيق يحتاج إلى تفعيل JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
